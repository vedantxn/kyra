[package]
name = "kyra"
version = "0.1.0"
description = "A proactive personal operations interface"
authors = ["Vedant"]
edition = "2021"

[lib]
name = "kyra_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
aes-gcm = "0.11.0"
async-trait = "0.1.89"
base64 = "0.22.1"
chrono = { version = "0.4.44", features = ["serde"] }
dotenvy = "0.15.7"
futures = "0.3.32"
hex = "0.4.3"
hmac = "0.12.1"
html2text = "0.17.1"
iana-time-zone = "0.1.64"
keyring = "4.1.6"
reqwest = { version = "0.13.4", default-features = false, features = ["form", "json", "query", "rustls"] }
regex = "1.12.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
tauri = { version = "2.11.5", features = ["macos-private-api"] }
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-opener = "2.5.4"
thiserror = "2.0.18"
tokio = { version = "1.50.0", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
url = "2.5.8"
uuid = { version = "1.22.0", features = ["v4", "serde"] }

[dev-dependencies]
wiremock = "0.6.5"
